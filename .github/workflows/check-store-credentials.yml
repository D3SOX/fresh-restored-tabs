name: Check AMO credentials

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  amo:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
      JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
    steps:
      - name: Check credentials
        run: |
          node --input-type=module <<'EOF'
          import { createHmac, randomUUID } from 'node:crypto';

          if (!process.env.JWT_ISSUER || !process.env.JWT_SECRET) {
            throw new Error('Missing secrets: AMO_JWT_ISSUER and/or AMO_JWT_SECRET');
          }

          const encode = (value) => Buffer.from(JSON.stringify(value)).toString('base64url');
          const issuedAt = Math.floor(Date.now() / 1000);
          const unsignedToken = [
            encode({ alg: 'HS256', typ: 'JWT' }),
            encode({
              iss: process.env.JWT_ISSUER,
              jti: randomUUID(),
              iat: issuedAt,
              exp: issuedAt + 60,
            }),
          ].join('.');
          const signature = createHmac('sha256', process.env.JWT_SECRET)
            .update(unsignedToken)
            .digest('base64url');
          const token = `${unsignedToken}.${signature}`;

          const profileResponse = await fetch('https://addons.mozilla.org/api/v5/accounts/profile/', {
            headers: { authorization: `JWT ${token}` },
          });

          if (!profileResponse.ok) {
            throw new Error(`AMO access check failed (${profileResponse.status})`);
          }

          console.log('AMO credentials are valid and can access the developer profile.');
          EOF
